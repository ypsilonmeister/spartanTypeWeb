name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_mode:
        description: >-
          production = 通常の本番ビルド /
          profile = 計測 + デバイスプローブ (probe.html) 入りビルド
        required: true
        default: production
        type: choice
        options:
          - production
          - profile

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # push トリガー時 inputs.build_mode は空になるため、既定は常に通常ビルド。
      # profile ビルドは Actions から手動で選んだときだけ走る
      # (probe.html と解析計測が含まれる。docs/analysis-profiling.md 参照)。
      - name: Build
        run: |
          if [ "${{ inputs.build_mode }}" = "profile" ]; then
            echo "::notice::Building in PROFILE mode (includes probe.html and analysis profiling)"
            npm run build:profile
          else
            echo "::notice::Building in PRODUCTION mode"
            npm run build
          fi
        env:
          GITHUB_PAGES_BASE: /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
